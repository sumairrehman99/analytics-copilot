services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    command: >
      streamlit run api/frontend.py
      --server.address=0.0.0.0
      --server.port=8501
    depends_on:
      - api